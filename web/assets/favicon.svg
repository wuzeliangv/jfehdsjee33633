<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="NodePool Gateway">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#151823;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0f1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5856D6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <!-- Glass border -->
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  
  <!-- Central hexagon node -->
  <polygon points="64,32 82,43 82,65 64,76 46,65 46,43" fill="none" stroke="url(#iconGrad)" stroke-width="3.5" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Top node -->
  <circle cx="64" cy="22" r="5" fill="url(#iconGrad)" filter="url(#glow)"/>
  <line x1="64" y1="27" x2="64" y2="32" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Top-right node -->
  <circle cx="92" cy="38" r="5" fill="url(#iconGrad)" filter="url(#glow)"/>
  <line x1="87.4" y1="40.5" x2="82" y2="43" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Bottom-right node -->
  <circle cx="92" cy="78" r="5" fill="url(#iconGrad)" filter="url(#glow)"/>
  <line x1="87.4" y1="75.5" x2="82" y2="73" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Bottom node -->
  <circle cx="64" cy="96" r="5" fill="#5856D6" filter="url(#glow)"/>
  <line x1="64" y1="91" x2="64" y2="85" stroke="#5856D6" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Bottom-left node -->
  <circle cx="36" cy="78" r="5" fill="#5856D6" filter="url(#glow)"/>
  <line x1="40.6" y1="75.5" x2="46" y2="73" stroke="#5856D6" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Top-left node -->
  <circle cx="36" cy="38" r="5" fill="url(#iconGrad)" filter="url(#glow)"/>
  <line x1="40.6" y1="40.5" x2="46" y2="43" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="64" cy="54" r="6" fill="url(#iconGrad)" filter="url(#glow)"/>
</svg>
