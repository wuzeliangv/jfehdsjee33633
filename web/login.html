<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodePool Gateway - 登录</title>
  <link rel="icon" href="./assets/favicon.ico" sizes="any">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <style>
    :root {
      --bg: #0d0e10;
      --panel: rgba(255, 255, 255, 0.075);
      --panel-strong: rgba(255, 255, 255, 0.11);
      --line: rgba(255, 255, 255, 0.12);
      --line-strong: rgba(255, 255, 255, 0.22);
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --blue: #0a84ff;
      --blue-2: #5e5ce6;
      --danger: #ff453a;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 18%, rgba(10, 132, 255, 0.16), transparent 30%),
        radial-gradient(circle at 88% 12%, rgba(255, 159, 10, 0.11), transparent 26%),
        radial-gradient(circle at 72% 84%, rgba(48, 209, 88, 0.10), transparent 30%),
        linear-gradient(135deg, #0d0e10 0%, #191a1f 52%, #0f1012 100%);
      display: grid;
      place-items: center;
      padding: 28px;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      width: min(960px, 100%);
      min-height: 540px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 32px;
      background: rgba(22, 22, 24, 0.56);
      backdrop-filter: blur(32px) saturate(165%);
      -webkit-backdrop-filter: blur(32px) saturate(165%);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .intro {
      position: relative;
      padding: 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--line);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.025)),
        radial-gradient(circle at 20% 30%, rgba(10, 132, 255, 0.17), transparent 34%);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      display: block;
      box-shadow: 0 10px 26px rgba(10, 132, 255, 0.18);
    }

    .intro-copy h1 {
      margin: 0;
      max-width: 420px;
      font-size: 42px;
      line-height: 1.08;
      font-weight: 760;
      letter-spacing: 0;
    }

    .intro-copy p {
      max-width: 430px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .status-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: #d8d8dc;
      font-size: 12px;
      font-weight: 650;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #30d158;
      box-shadow: 0 0 14px rgba(48, 209, 88, 0.8);
    }

    .login-pane {
      padding: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 8, 10, 0.22);
    }

    .login-form {
      width: 100%;
      max-width: 360px;
    }

    .form-title {
      margin-bottom: 28px;
    }

    .form-title h2 {
      margin: 0;
      font-size: 25px;
      font-weight: 740;
      letter-spacing: 0;
    }

    .form-title p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin: 0 0 8px 2px;
      color: #d6d6da;
      font-size: 13px;
      font-weight: 650;
    }

    .input-field {
      width: 100%;
      height: 48px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .input-field::placeholder {
      color: rgba(235, 235, 245, 0.35);
    }

    .input-field:focus {
      border-color: rgba(10, 132, 255, 0.72);
      background: rgba(0, 0, 0, 0.38);
      box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .error-message {
      min-height: 20px;
      margin: 8px 0 14px 2px;
      color: var(--danger);
      display: none;
      font-size: 13px;
      line-height: 1.45;
    }

    .login-btn {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      color: #fff;
      font: inherit;
      font-size: 15px;
      font-weight: 720;
      background: linear-gradient(135deg, var(--blue), var(--blue-2));
      box-shadow: 0 12px 28px rgba(10, 132, 255, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }

    .login-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 16px 34px rgba(10, 132, 255, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }

    .login-btn:active:not(:disabled) {
      transform: translateY(0) scale(0.985);
    }

    .login-btn:disabled {
      opacity: 0.55;
      cursor: default;
      box-shadow: none;
    }

    @media (max-width: 760px) {
      body {
        padding: 14px;
        place-items: stretch;
      }

      .shell {
        min-height: calc(100vh - 28px);
        grid-template-columns: 1fr;
        border-radius: 26px;
      }

      .intro {
        min-height: 260px;
        padding: 30px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .intro-copy h1 {
        font-size: 30px;
      }

      .login-pane {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="intro">
      <div class="brand">
        <img class="brand-mark" src="./assets/favicon.svg" alt="" aria-hidden="true">
        NodePool Gateway
      </div>

      <div class="intro-copy">
        <h1>本机代理网关控制台</h1>
        <p>管理节点、路由策略和本机 HTTP/SOCKS5 出口。登录后进入私有控制面板。</p>
      </div>

      <div class="status-strip" aria-label="服务状态">
        <span class="chip"><span class="dot"></span> Web Console</span>
        <span class="chip">Local Proxy</span>
        <span class="chip">OpenVPN Core</span>
      </div>
    </section>

    <section class="login-pane">
      <form id="login_form" class="login-form" onsubmit="handleLogin(event)">
        <div class="form-title">
          <h2>登录</h2>
          <p>请输入管理账号和密码。</p>
        </div>

        <div class="field">
          <label for="username">管理账号</label>
          <input type="text" id="username" name="username" class="input-field" placeholder="Username" required autocomplete="username">
        </div>

        <div class="field">
          <label for="password">安全密码</label>
          <input type="password" id="password" name="password" class="input-field" placeholder="Password" required autocomplete="current-password">
          <div id="error_text" class="error-message"></div>
        </div>

        <button type="submit" id="submit_btn" class="login-btn">
          <span>进入控制台</span>
        </button>
      </form>
    </section>
  </main>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const uname = document.getElementById("username").value.trim();
      const pwd = document.getElementById("password").value.trim();
      const errorText = document.getElementById("error_text");
      const submitBtn = document.getElementById("submit_btn");

      errorText.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.querySelector("span").textContent = "正在验证...";

      try {
        const response = await fetch("./api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: uname, password: pwd })
        });

        const data = await response.json();
        if (response.ok && data.ok) {
          if (data.token) {
            document.cookie = `session=${data.token}; Path=/; Max-Age=2592000; SameSite=Lax`;
          }
          window.location.reload();
        } else {
          errorText.textContent = data.error || "账号或密码不正确，请重新输入";
          errorText.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.querySelector("span").textContent = "进入控制台";
        }
      } catch (err) {
        errorText.textContent = "连接服务器失败，请稍后重试";
        errorText.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.querySelector("span").textContent = "进入控制台";
      }
    }
  </script>
</body>
</html>
