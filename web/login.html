<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aimili - 安全登录</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070913;
      --bg-surface: rgba(255, 255, 255, 0.03);
      --bg-surface-hover: rgba(255, 255, 255, 0.05);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-focus: rgba(0, 122, 255, 0.65);
      --text-primary: #f5f5f7;
      --text-secondary: #86868b;
      --primary: #007aff;
      --primary-gradient: linear-gradient(135deg, #007aff 0%, #5856d6 100%);
      --primary-hover: linear-gradient(135deg, #1485ff 0%, #6866e6 100%);
      --success: #34c759;
      --danger: #ff3b30;
      
      /* Neumorphic Shadows for Dark Mode */
      --neumorphic-outset: 0 15px 35px rgba(0, 0, 0, 0.5), 
                            inset 0 1px 0 rgba(255, 255, 255, 0.05),
                            -2px -2px 10px rgba(255, 255, 255, 0.01),
                            2px 2px 10px rgba(0, 0, 0, 0.3);
      --neumorphic-inset: inset 2px 2px 5px rgba(0, 0, 0, 0.4), 
                           inset -2px -2px 5px rgba(255, 255, 255, 0.03);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.12) 0px, transparent 40%),
        radial-gradient(at 100% 0%, rgba(88, 86, 214, 0.12) 0px, transparent 40%),
        radial-gradient(at 50% 100%, rgba(52, 199, 89, 0.05) 0px, transparent 50%);
      background-attachment: fixed;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient animated blurred lights in the background */
    .ambient-lights {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .light-spot {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      animation: float 20s infinite alternate ease-in-out;
    }

    .light-spot-1 {
      width: 400px;
      height: 400px;
      background: #007aff;
      top: -100px;
      left: -100px;
    }

    .light-spot-2 {
      width: 500px;
      height: 500px;
      background: #5856d6;
      bottom: -150px;
      right: -100px;
      animation-duration: 25s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.1); }
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-sizing: border-box;
      z-index: 1;
    }

    .login-card {
      background: rgba(20, 20, 25, 0.35);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 44px 36px;
      box-shadow: var(--neumorphic-outset);
      text-align: center;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .brand-logo {
      width: 68px;
      height: 68px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px auto;
      color: var(--text-primary);
      position: relative;
      box-shadow: var(--neumorphic-inset);
      transition: all 0.3s ease;
    }

    .brand-logo::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      border: 1.5px solid rgba(0, 122, 255, 0.4);
      opacity: 0.8;
      animation: ripple 2.5s infinite cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes ripple {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    .login-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 10px 0;
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin: 0 0 36px 0;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 22px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      opacity: 0.85;
      margin-bottom: 9px;
      margin-left: 4px;
      letter-spacing: 0.2px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-field {
      width: 100%;
      height: 48px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0 16px;
      box-sizing: border-box;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 15px;
      outline: none;
      box-shadow: var(--neumorphic-inset);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .input-field:focus {
      border-color: var(--border-color-focus);
      box-shadow: var(--neumorphic-inset), 0 0 0 3px rgba(0, 122, 255, 0.2);
      background: rgba(0, 0, 0, 0.4);
    }

    .error-message {
      color: var(--danger);
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
      text-align: left;
      margin-left: 4px;
      font-weight: 500;
      display: none;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .login-btn {
      width: 100%;
      height: 48px;
      background: var(--primary-gradient);
      border: none;
      border-radius: 12px;
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.3), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 12px 30px rgba(0, 122, 255, 0.45), 
                  inset 0 1px 0 rgba(255, 255, 255, 0.3);
      transform: translateY(-1.5px);
    }

    .login-btn:active {
      transform: scale(0.97) translateY(0);
      box-shadow: 0 4px 10px rgba(0, 122, 255, 0.2);
    }

    .login-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <div class="ambient-lights">
    <div class="light-spot light-spot-1"></div>
    <div class="light-spot light-spot-2"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h2 class="login-title">Aimili</h2>
      <p class="login-subtitle">请输入您的管理账号和安全密码以继续</p>
      
      <form id="login_form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">管理账号</label>
          <div class="input-wrapper">
            <input type="text" id="username" name="username" class="input-field" placeholder="请输入管理账号" required autocomplete="username">
          </div>
        </div>
        <div class="form-group" style="margin-top: 18px;">
          <label class="form-label" for="password">安全密码</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" class="input-field" placeholder="请输入安全密码" required autocomplete="current-password">
          </div>
          <div id="error_text" class="error-message"></div>
        </div>
        
        <button type="submit" id="submit_btn" class="login-btn" style="margin-top: 32px;">
          <span>登录</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const uname = document.getElementById("username").value.trim();
      const pwd = document.getElementById("password").value.trim();
      const errorText = document.getElementById("error_text");
      const submitBtn = document.getElementById("submit_btn");
      
      errorText.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.querySelector("span").textContent = "正在验证...";
      
      try {
        const response = await fetch("./api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: uname, password: pwd })
        });
        
        const data = await response.json();
        if (response.ok && data.ok) {
          window.location.reload();
        } else {
          errorText.textContent = data.error || "账号或密码不正确，请重新输入";
          errorText.style.display = "block";
          submitBtn.disabled = false;
          submitBtn.querySelector("span").textContent = "登录";
        }
      } catch (err) {
        errorText.textContent = "连接服务器失败，请稍后重试";
        errorText.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.querySelector("span").textContent = "登录";
      }
    }
  </script>
</body>
</html>
