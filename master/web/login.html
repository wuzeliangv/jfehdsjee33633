<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodePool Master · 登录</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg-card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --text: #e6e8ee;
      --text-dim: #98a0b3;
      --accent: #5b9dff;
      --danger: #f43f5e;
      --success: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(circle at 20% 30%, rgba(91,157,255,0.10) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(244,63,94,0.06) 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    .card {
      width: 100%; max-width: 380px;
      padding: 36px 32px;
      background: rgba(20,22,30,0.7);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
    .sub { margin: 0 0 28px; font-size: 13px; color: var(--text-dim); }
    label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
    input {
      width: 100%; height: 42px; padding: 0 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text); font-size: 14px;
      font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      outline: none; transition: border-color .2s;
    }
    input:focus { border-color: var(--accent); }
    button {
      width: 100%; height: 42px; margin-top: 18px;
      background: linear-gradient(135deg, #5b9dff 0%, #4078d6 100%);
      color: #fff; border: none; border-radius: 9px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: filter .2s;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .msg { margin-top: 16px; font-size: 12px; min-height: 16px; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--success); }
    .footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);
              font-size: 11px; color: var(--text-dim); text-align: center; }
    .footer code { font-family: "JetBrains Mono", monospace; color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <h1>NodePool 主控</h1>
    <p class="sub">输入 <code>admin_token</code> 登录管理面板</p>
    <form id="loginForm" autocomplete="off">
      <label for="token">管理口令</label>
      <input type="password" id="token" name="token" autofocus required spellcheck="false">
      <button type="submit" id="submitBtn">登录</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="footer">
      口令位于主控的 <code>master_data/master_config.json</code><br>
      或运行 <code>./master_admin.py show-tokens</code> 查看
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const tokenInput = document.getElementById("token");
    const msgEl = document.getElementById("msg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgEl.className = "msg";
      msgEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "登录中...";
      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: tokenInput.value })
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          msgEl.className = "msg ok";
          msgEl.textContent = "登录成功,跳转中...";
          setTimeout(() => { window.location.href = "/dashboard"; }, 300);
        } else {
          msgEl.className = "msg err";
          msgEl.textContent = data.error || "登录失败";
          submitBtn.disabled = false;
          submitBtn.textContent = "登录";
        }
      } catch (err) {
        msgEl.className = "msg err";
        msgEl.textContent = "请求失败: " + err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = "登录";
      }
    });
  </script>
</body>
</html>
