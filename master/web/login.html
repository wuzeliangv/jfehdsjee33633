<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodePool Master · 登录</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    :root {
      --bg-color: #f5f5f7;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.5);
      --text-main: #1d1d1f;
      --text-sec: #86868b;
      --accent: #0066cc;
      --danger: #ff3b30;
      --success: #34c759;
      --font-apple: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: 
        radial-gradient(circle at 10% 20%, rgba(220, 240, 255, 0.8), transparent 40%),
        radial-gradient(circle at 90% 30%, rgba(255, 225, 240, 0.7), transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(225, 255, 225, 0.7), transparent 40%),
        #f5f5f7;
      background-attachment: fixed;
      color: var(--text-main);
      font-family: var(--font-apple);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 400px;
      padding: 40px 36px;
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.08);
      text-align: center;
    }
    .logo { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 600; letter-spacing: -0.5px; }
    .sub { margin: 0 0 32px; font-size: 14px; color: var(--text-sec); }
    
    .form-group { text-align: left; }
    label { display: block; font-size: 12px; color: var(--text-sec); margin-bottom: 8px; font-weight: 600; }
    input {
      width: 100%; height: 46px; padding: 0 16px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 12px;
      color: var(--text-main); font-size: 15px;
      font-family: "SF Mono", "Fira Code", monospace;
      outline: none; transition: all .2s;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,102,204,0.15); }
    button {
      width: 100%; height: 46px; margin-top: 24px;
      background: var(--accent);
      color: #fff; border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: all .2s; box-shadow: 0 4px 12px rgba(0,102,204,0.3);
    }
    button:hover { background: #0077ed; box-shadow: 0 6px 16px rgba(0,102,204,0.4); transform: translateY(-1px); }
    button:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .msg { margin-top: 16px; font-size: 13px; font-weight: 500; min-height: 18px; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--success); }
    
    .footer { margin-top: 32px; font-size: 12px; color: var(--text-sec); text-align: center; }
    .footer code { font-family: "SF Mono", monospace; color: #1d1d1f; background: rgba(0,0,0,0.05); padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/logo.png" alt="NodePool Logo" class="logo">
    <h1>NodePool Master</h1>
    <p class="sub">输入管理口令以访问控制中心</p>
    
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="token">管理口令 (Admin Token)</label>
        <input type="password" id="token" name="token" autofocus required spellcheck="false" placeholder="••••••••">
      </div>
      <button type="submit" id="submitBtn">登录面板</button>
      <div class="msg" id="msg"></div>
    </form>
    
    <div class="footer">
      如忘密码，请在服务器终端执行<br><br>
      <code>./master_admin.py show-tokens</code>
    </div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const tokenInput = document.getElementById("token");
    const msgEl = document.getElementById("msg");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgEl.className = "msg";
      msgEl.textContent = "";
      submitBtn.disabled = true;
      submitBtn.textContent = "正在验证...";
      
      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: tokenInput.value })
        });
        const data = await res.json();
        
        if (res.ok && data.ok) {
          msgEl.className = "msg ok";
          msgEl.textContent = "验证成功，正在跳转...";
          setTimeout(() => { window.location.href = "/"; }, 400);
        } else {
          msgEl.className = "msg err";
          msgEl.textContent = data.error || "口令无效，请重试";
          submitBtn.disabled = false;
          submitBtn.textContent = "登录面板";
          tokenInput.value = "";
          tokenInput.focus();
        }
      } catch (err) {
        msgEl.className = "msg err";
        msgEl.textContent = "网络请求失败，请检查连接";
        submitBtn.disabled = false;
        submitBtn.textContent = "登录面板";
      }
    });
  </script>
</body>
</html>
