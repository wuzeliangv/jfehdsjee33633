<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodePool Master Dashboard</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg-card: rgba(255,255,255,0.04);
      --bg-card-2: rgba(255,255,255,0.025);
      --border: rgba(255,255,255,0.08);
      --text: #e6e8ee;
      --text-dim: #98a0b3;
      --accent: #5b9dff;
      --danger: #f43f5e;
      --success: #10b981;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding-bottom: 60px;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 28px;
      background: rgba(20,22,30,0.7); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
    .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px rgba(16,185,129,0.6); }
    .topbar-actions { display: flex; gap: 12px; align-items: center; }
    .btn-ghost {
      height: 32px; padding: 0 14px; font-size: 12px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text);
      border-radius: 7px; cursor: pointer; transition: background .15s;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }
    .btn-danger { color: var(--danger); border-color: rgba(244,63,94,0.3); }
    .btn-danger:hover { background: rgba(244,63,94,0.12); }

    main { max-width: 1300px; margin: 28px auto; padding: 0 28px; }
    h2 { margin: 0 0 16px; font-size: 14px; font-weight: 600; color: var(--text-dim);
         text-transform: uppercase; letter-spacing: 1px; }
    .row { display: grid; gap: 20px; margin-bottom: 28px; }
    .row.cards { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
    .row.two-col { grid-template-columns: 1fr 1.5fr; }
    @media (max-width: 900px) { .row.two-col { grid-template-columns: 1fr; } }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    .stat .lbl { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .stat .val { font-size: 30px; font-weight: 600; margin-top: 8px; }
    .stat.alive .val   { color: var(--success); }
    .stat.dead  .val   { color: var(--danger); }
    .stat.unknown .val { color: var(--warn); }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
    th { color: var(--text-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--bg-card-2); }

    .pill { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
    .pill.online   { background: rgba(16,185,129,0.15); color: var(--success); }
    .pill.offline  { background: rgba(244,63,94,0.12); color: var(--danger); }
    .pill.stalled  { background: rgba(245,158,11,0.12); color: var(--warn); }
    .pill.disabled { background: rgba(255,255,255,0.06); color: var(--text-dim); }

    code, .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 12px; }
    .agent-id { color: var(--text-dim); }

    .agent-actions { display: flex; gap: 6px; }
    .agent-actions button {
      height: 26px; padding: 0 10px; font-size: 11px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: var(--text);
      border-radius: 6px; cursor: pointer; transition: background .15s;
    }
    .agent-actions button:hover { background: rgba(255,255,255,0.1); }
    .agent-actions .del { color: var(--danger); border-color: rgba(244,63,94,0.3); }
    .agent-actions .del:hover { background: rgba(244,63,94,0.12); }

    #toast {
      position: fixed; right: 24px; bottom: 24px; max-width: 360px;
      padding: 12px 16px; border-radius: 10px; font-size: 13px;
      background: rgba(20,22,30,0.95); border: 1px solid var(--border);
      transform: translateY(150%); transition: transform .25s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    #toast.show { transform: translateY(0); }
    #toast.ok { border-color: var(--success); }
    #toast.err { border-color: var(--danger); color: var(--danger); }

    .empty { text-align: center; padding: 40px 0; color: var(--text-dim); font-size: 13px; }
    .refresh-info { font-size: 11px; color: var(--text-dim); margin-left: 8px; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand"><span class="dot"></span> NodePool 主控 Dashboard
      <span class="refresh-info" id="lastRefresh">--</span>
    </div>
    <div class="topbar-actions">
      <button class="btn-ghost" onclick="refresh()">手动刷新</button>
      <button class="btn-ghost btn-danger" onclick="logout()">退出</button>
    </div>
  </div>

  <main>
    <h2>节点池概览</h2>
    <div class="row cards">
      <div class="card stat"><div class="lbl">节点总数</div><div class="val" id="stat-total">--</div></div>
      <div class="card stat alive"><div class="lbl">存活</div><div class="val" id="stat-alive">--</div></div>
      <div class="card stat dead"><div class="lbl">死亡</div><div class="val" id="stat-dead">--</div></div>
      <div class="card stat unknown"><div class="lbl">未知</div><div class="val" id="stat-unknown">--</div></div>
      <div class="card stat"><div class="lbl">在线被控</div><div class="val" id="stat-agents">--</div></div>
    </div>

    <div class="row two-col">
      <div class="card">
        <h2>地区分布</h2>
        <table>
          <thead><tr><th>国家</th><th>总计</th><th>存活</th></tr></thead>
          <tbody id="country-tbody"><tr><td colspan="3" class="empty">加载中...</td></tr></tbody>
        </table>
      </div>

      <div class="card">
        <h2>被控列表</h2>
        <table>
          <thead><tr>
            <th>名称 / Agent</th><th>状态</th><th>上次心跳</th><th>IP</th><th>本地节点池</th><th>操作</th>
          </tr></thead>
          <tbody id="agents-tbody"><tr><td colspan="6" class="empty">加载中...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    let timer = null;

    function fmtAge(ts) {
      if (!ts) return "—";
      const d = Math.max(0, Math.floor(Date.now()/1000 - ts));
      if (d < 60) return d + "s 前";
      if (d < 3600) return Math.floor(d/60) + "m 前";
      if (d < 86400) return Math.floor(d/3600) + "h 前";
      return Math.floor(d/86400) + "d 前";
    }

    function classifyAgent(a) {
      if (!a.enabled) return { cls: "disabled", txt: "已禁用" };
      if (!a.last_seen) return { cls: "offline", txt: "未上线" };
      const age = Math.floor(Date.now()/1000 - a.last_seen);
      if (age < 180) return { cls: "online", txt: "在线" };
      if (age < 600) return { cls: "stalled", txt: "心跳停滞" };
      return { cls: "offline", txt: "离线" };
    }

    function toast(msg, type) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.className = "show " + (type || "");
      setTimeout(() => { t.className = t.className.replace("show", "").trim(); }, 2400);
    }

    async function fetchJSON(path, opts) {
      const res = await fetch(path, opts || {});
      if (res.status === 401) {
        // 鉴权失效,回登录
        window.location.href = "/login";
        throw new Error("unauthorized");
      }
      return await res.json();
    }

    async function loadStats() {
      const data = await fetchJSON("/admin/api/stats");
      if (!data.ok) return;
      const s = data.stats;
      document.getElementById("stat-total").textContent   = s.nodes.total;
      document.getElementById("stat-alive").textContent   = s.nodes.alive;
      document.getElementById("stat-dead").textContent    = s.nodes.dead;
      document.getElementById("stat-unknown").textContent = s.nodes.unknown;
      document.getElementById("stat-agents").textContent  = s.agents;

      const tbody = document.getElementById("country-tbody");
      if (!s.by_country || s.by_country.length === 0) {
        tbody.innerHTML = "<tr><td colspan='3' class='empty'>暂无节点</td></tr>";
      } else {
        tbody.innerHTML = s.by_country.map(r => `
          <tr>
            <td><code>${r.country_code || '??'}</code></td>
            <td>${r.total}</td>
            <td><span style="color:var(--success)">${r.alive || 0}</span></td>
          </tr>
        `).join("");
      }
    }

    async function loadAgents() {
      const data = await fetchJSON("/admin/api/agents");
      if (!data.ok) return;
      const tbody = document.getElementById("agents-tbody");
      if (!data.agents || data.agents.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6' class='empty'>尚未有被控注册</td></tr>";
        return;
      }
      tbody.innerHTML = data.agents.map(a => {
        const c = classifyAgent(a);
        const st = a.stats || {};
        const localStats = st.local_node_count !== undefined
          ? `<code>${st.alive_count || 0}/${st.local_node_count || 0}</code>`
          : "<span style='color:var(--text-dim)'>—</span>";
        const toggleAction = a.enabled
          ? `<button onclick="agentAction('disable','${a.agent_id}')">禁用</button>`
          : `<button onclick="agentAction('enable','${a.agent_id}')">启用</button>`;
        return `
          <tr>
            <td>
              <div>${escapeHtml(a.name || '(未命名)')}</div>
              <div class="agent-id mono">${a.agent_id}</div>
            </td>
            <td><span class="pill ${c.cls}">${c.txt}</span></td>
            <td>${fmtAge(a.last_seen)}</td>
            <td class="mono">${a.last_ip || '—'}</td>
            <td>${localStats}</td>
            <td><div class="agent-actions">
              ${toggleAction}
              <button class="del" onclick="agentAction('delete','${a.agent_id}')">删除</button>
            </div></td>
          </tr>
        `;
      }).join("");
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[c]));
    }

    async function agentAction(action, agentId) {
      if (action === "delete" && !confirm(`确认删除 agent ${agentId}? 该被控将失去访问权限。`)) return;
      try {
        const res = await fetchJSON(`/admin/api/agents/${action}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ agent_id: agentId })
        });
        if (res.ok) {
          toast(action + " 成功", "ok");
          loadAgents();
        } else {
          toast("操作失败: " + (res.error || ""), "err");
        }
      } catch (e) {
        toast("请求失败: " + e.message, "err");
      }
    }

    async function refresh() {
      try {
        await Promise.all([loadStats(), loadAgents()]);
        document.getElementById("lastRefresh").textContent = "刷新于 " + new Date().toLocaleTimeString();
      } catch (e) {
        if (e.message !== "unauthorized") {
          toast("刷新失败: " + e.message, "err");
        }
      }
    }

    async function logout() {
      try { await fetch("/logout", { method: "POST" }); } catch (e) {}
      window.location.href = "/login";
    }

    refresh();
    timer = setInterval(refresh, 15000);
  </script>
</body>
</html>
